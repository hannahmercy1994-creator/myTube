version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mytube-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./database:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-mytube-secret-key-change-in-production}
      - DATABASE_URL=sqlite+aiosqlite:///./data/mytube.db
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
    restart: unless-stopped
    networks:
      - mytube-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mytube-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - mytube-network

  nginx:
    image: nginx:alpine
    container_name: mytube-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - mytube-network

networks:
  mytube-network:
    driver: bridge
